# Used by dx for the Android view-only build. Desktop builds use plain cargo.
# CI appends a [bundle.android] signing section from repository secrets; never commit one.
[application]
name = "molip-quest"
# Edge-to-edge activity that tints the system bars like the page and passes insets to CSS.
android_main_activity = "packaging/android/MainActivity.kt"

[bundle]
identifier = "dev.molipquest.app"
publisher = "Molip Quest"
icon = ["assets/icon/icon-1024.png"]
