<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MQ · 학습 현황</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a href="https://github.com/jhs512/immersion-quest-3">MQ</a><p>학습 현황</p><h1>어디까지 배웠을까요?</h1><p>코스의 공개 진도 기록을 한곳에서 확인해요.</p></header>
<form id="lookup"><label for="repo">코스 저장소</label><div class="controls"><input id="repo" name="repo" placeholder="owner/course-repository" required spellcheck="false"><button id="load">조회</button></div><div id="presets" class="presets"><button type="button" data-repo="jhs512/mq3-course-redesigned-java-backend">자바 백엔드</button><button type="button" data-repo="jhs512/mq3-course-redesigned-aice-associate">AICE Associate</button><button type="button" data-repo="jhs512/mq3-course-redesigned-engineer-practical">정보처리기사 실기</button></div></form>
<p id="status" role="status" aria-live="polite">코스를 선택하거나 저장소를 입력하세요.</p>
<section id="results" hidden><div class="heading"><h2 id="title"></h2><input id="search" type="search" placeholder="학생 계정 검색" aria-label="학생 계정 검색"></div><div id="stats" class="stats"></div><div id="students"></div></section>
<footer><p>GitHub에 게시된 코스와 전송된 기록을 보여요. 앱 안의 미전송 기록은 보이지 않아요.</p><p>공개 이슈를 조회하는 화면이에요. 관리자 전용 비공개 화면은 아니에요.</p><p>코스별 이름 등록은 아직 지원하지 않아요. GitHub 계정으로 표시해요.</p></footer></main><script type="module" src="app.mjs"></script></body></html>
