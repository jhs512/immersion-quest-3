<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MQ · 수업 열기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#122231;color:#e3eef8;font-family:system-ui,sans-serif;padding:24px}main{width:min(100%,520px);padding:28px;border:1px solid #38546b;border-radius:16px;background:#1b3043}h1{font-size:26px;margin-top:0}p{line-height:1.6;color:#c1d4e5}.open{display:block;padding:14px;text-align:center;background:#237d65;color:white;border-radius:9px;text-decoration:none;font-weight:bold}.downloads{display:flex;gap:16px;flex-wrap:wrap}a{color:#a2d9ff}details{font-size:13px;margin:20px 0;overflow-wrap:anywhere}code{display:block;margin:8px 0;color:#c1d4e5}footer{font-size:13px;margin-top:24px}.hidden{display:none}
</style></head><body><main>
<h1>MQ에서 수업을 열어요</h1>
<p id="status" role="status">수업 링크를 확인하고 있어요.</p>
<a id="open" class="open hidden">MQ에서 수업 열기</a>
<details id="details" class="hidden"><summary>연결된 코스와 수업</summary><code id="course"></code><code id="lesson"></code></details>
<footer><p>앱이 열리지 않나요?<br>최신 MQ를 설치한 뒤 다시 눌러 주세요.</p><div class="downloads">
<a href="https://github.com/jhs512/immersion-quest-3/releases/latest/download/molip-quest-3-windows-x64-setup.exe">Windows 설치</a>
<a href="https://github.com/jhs512/immersion-quest-3/releases/latest/download/molip-quest-3-macos-arm64.dmg">Mac 설치 · Apple Silicon</a>
</div><p>브라우저에서 앱을 열지 물으면 허용하세요.<br>GitHub 로그인 후 연결된 수업으로 이동해요.</p></footer>
</main><script type="module">
import {lessonTarget} from './link.mjs';
const status=document.getElementById('status');
try {
 const target=lessonTarget(location.search), open=document.getElementById('open');
 open.href=target.app;open.classList.remove('hidden');
 document.getElementById('course').textContent=target.course;document.getElementById('lesson').textContent=target.lesson;document.getElementById('details').classList.remove('hidden');
 status.textContent='아래 버튼을 누르면 연결된 수업으로 이동해요.';
 open.addEventListener('click',()=>{status.textContent='MQ로 연결했어요. 앱이 안 열리면 설치 후 다시 눌러 주세요.';});
} catch(error){status.textContent=error.message;}
</script></body></html>
