name: MQ3 desktop release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mq3-release-${{ github.ref }}
  cancel-in-progress: true
env:
  MOLIP_BUILD: ${{ github.run_number }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify MQ3 updater
        run: |
          cargo test --release --locked --lib updater::tests
          cargo test --release --locked --lib course_visibility::tests
          cargo test --release --locked --lib progress_sync::tests
      - name: Verify interactive setup terminal
        run: cargo test --release --locked --lib setup_terminal::tests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify persistent Java build workspace
        run: cargo test --release --locked --test java_launch --test java_arguments --test bundled_courses --test github_pr --test redesigned_git_branch --test bash_basics --test vim_practice --test step_reset
      - name: Verify app-managed Java and C setup
        run: |
          cargo test --release --locked --lib runtime_setup::tests::selects_the_native_cpu_and_rejects_foreign_packages
          cargo test --release --locked --lib runtime_setup::tests::clean_java_install_runs_without_a_system_jdk_or_path_changes -- --ignored --nocapture --test-threads=1
          cargo test --release --locked --lib runtime_setup::tests::c_preparation_compiles_and_runs_on_this_platform -- --ignored --nocapture --test-threads=1
      - name: Build clean release executable
        run: cargo build --release --locked --bin molip-quest
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build MQ3 installer
        shell: pwsh
        run: |
          $version = (Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
      - name: Verify installer and uninstall
        shell: pwsh
        run: |
          python tools/verify-release-assets.py target/installers --windows-only
          if ($LASTEXITCODE -ne 0) { throw 'Installer validation failed.' }
          $installPath = Join-Path $env:RUNNER_TEMP 'mq3-install-check'
          $installer = Start-Process target/installers/molip-quest-3-windows-x64-setup.exe -WindowStyle Hidden -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath") -Wait -PassThru
          if ($installer.ExitCode -ne 0 -or !(Test-Path "$installPath/molip-quest.exe")) { throw 'Installation failed.' }
          $uninstaller = Start-Process "$installPath/unins000.exe" -WindowStyle Hidden -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstaller.ExitCode -ne 0) { throw 'Uninstallation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: mq3-windows-x64
          path: target/installers/molip-quest-3-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      MQ3_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify updater and interactive terminal
        run: |
          cargo test --release --locked --lib updater::tests
          cargo test --release --locked --lib setup_terminal::tests
          cargo test --release --locked --lib course_visibility::tests
          cargo test --release --locked --lib progress_sync::tests
      - name: Verify C, Java and Python execution on this Mac
        run: cargo test --release --locked --test macos_runtime --test java_launch --test java_arguments --test bundled_courses --test github_pr --test redesigned_git_branch --test bash_basics --test vim_practice --test step_reset
      - name: Verify app-managed Java and C setup
        run: |
          cargo test --release --locked --lib runtime_setup::tests::selects_the_native_cpu_and_rejects_foreign_packages
          cargo test --release --locked --lib runtime_setup::tests::clean_java_install_runs_without_a_system_jdk_or_path_changes -- --ignored --nocapture --test-threads=1
          cargo test --release --locked --lib runtime_setup::tests::c_preparation_compiles_and_runs_on_this_platform -- --ignored --nocapture --test-threads=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify lesson loading and Edge audio in native WKWebView
        run: |
          python -m pip install edge-tts==7.3.1
          export MOLIP_PYTHON="$(which python)"
          cargo test --locked --test player_loading_native --test player_java_launch_native --test player_java_arguments_native --test player_git_course_native --test player_bash_native --test player_async_progress_native --test player_content_submit_native -- --ignored --nocapture --test-threads=1
      - name: Upload native WebView diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-webview-${{ matrix.arch }}
          path: |
            target/pilot-native-result.json
            target/pilot-java-launch-native-result.json
            target/pilot-java-arguments-native-result.json
            target/pilot-git-course-native-result.json
            target/pilot-bash-native-result.json
            target/pilot-async-progress-result.json
            target/mq-content-submit-native-result.json
          if-no-files-found: ignore
      - name: Build and package macOS app
        run: |
          cargo build --release --locked --bin molip-quest
          bash packaging/macos/bundle.sh
          codesign --verify --deep --strict 'target/bundle/MQ.app'
          hdiutil verify "target/installers/molip-quest-3-macos-${MQ3_MAC_ARCH}.dmg"
      - name: Verify native launch and architecture
        run: |
          set -euo pipefail
          executable='target/bundle/MQ.app/Contents/MacOS/molip-quest'
          expected="$MQ3_MAC_ARCH"
          lipo "$executable" -verify_arch "$expected"
          "$executable" > target/macos-launch.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 12
          kill -0 "$app_pid" || { cat target/macos-launch.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: mq3-macos-${{ matrix.arch }}
          path: target/installers/molip-quest-3-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.repository == 'jhs512/immersion-quest-3' && github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: mq3-*
          merge-multiple: true
          path: target/release-assets
      - name: Require completed installer and checksum
        run: |
          set -euo pipefail
          python3 tools/test_macos_installer.py
          python3 tools/test_release_assets.py
          python3 tools/verify-release-assets.py target/release-assets --desktop
          (cd target/release-assets && sha256sum molip-quest-3-windows-x64-setup.exe molip-quest-3-macos-arm64.dmg > SHA256SUMS)
      - name: Publish only after uploading verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v${version}-build.${RUN_NUMBER}"
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if ! jq -e '.isDraft' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo 'This build was already published.'
              exit 0
            fi
          else
            printf 'MQ3 Windows x64, macOS Apple Silicon installers. Source commit: %s\n\nLearning progress uses your existing gh login.\nWindows code signing and Apple notarization are not configured.\n' "$COMMIT_SHA" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --draft --target "$COMMIT_SHA" --title "MQ · $tag" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" --clobber target/release-assets/molip-quest-3-windows-x64-setup.exe target/release-assets/molip-quest-3-macos-arm64.dmg target/release-assets/SHA256SUMS
          gh release edit "$tag" --draft=false --latest
