name: Principles runtime validation

on:
  push:
    branches: [feat/principles-expansion]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: principles-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare native CLI dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libx11-dev
      - name: Confirm the real Linux container engine
        run: |
          docker info --format '{{.OSType}}'
          docker compose version
      - name: Build the actual headless graders
        run: cargo build --locked --no-default-features --example validate_redesigned_lesson
      - name: Verify ownership, boundaries and hard-kill cleanup
        run: cargo test --locked --no-default-features --lib docker_lab -- --include-ignored --test-threads=1
      - name: Prepare the shared pinned JDBC cache once
        run: cargo test --locked --no-default-features --lib library_sets::runtime_tests -- --ignored --test-threads=1
      - name: Check all fourteen lessons with real engines
        shell: python
        run: |
          import concurrent.futures, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('tools/principles_lessons').resolve()))
          from make import NEW_ORDER
          def validate(key):
              print(f'BEGIN {key}', flush=True)
              result = subprocess.run(['target/debug/examples/validate_redesigned_lesson',
                  f'tests/lesson-cases/{key}.json', f'target/principles-{key}.json'])
              return result.returncode
          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              pending = {pool.submit(validate, key): key for key in NEW_ORDER}
              for future in concurrent.futures.as_completed(pending):
                  key = pending[future]
                  try:
                      code = future.result()
                  except Exception as error:
                      print(f'LAUNCH ERROR {key}: {error}', flush=True)
                      code = 1
                  print(f'{"PASS" if code == 0 else "FAIL"} {key}', flush=True)
                  if code:
                      failures.append(key)
          if failures:
              raise SystemExit('Failed lessons: ' + ', '.join(failures))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: principles-actual-engine-evidence
          path: target/principles-*.json
