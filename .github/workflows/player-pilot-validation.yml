name: Player pilot validation
on:
  push:
    branches: [codex/player-content-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        group: [core, java, python, data, c]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the approved table lesson's pandas version
        run: python -m pip install "numpy<2" "pandas==1.5.3" "matplotlib==3.7.1" "seaborn==0.12.1"
      - name: Use the same Python interpreter inside the player
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'MOLIP_PYTHON={sys.executable}\n')
      - uses: Swatinem/rust-cache@v2
        with:
          key: pilot-${{ matrix.os }}
          cache-on-failure: true
      - name: Check hierarchy, legacy compatibility and isolated transport
        if: matrix.group == 'core'
        run: cargo test --locked --test nested_repository_course --test reviewed_pilot --test supporting_materials --test repository_review_modes --test pilot_transport --test task_interactions --test interaction_examples --test interaction_fields --test example_predictions --test java_prepared_values --test redesigned_java_values --test redesigned_aice_python --test redesigned_aice_conditions --test redesigned_aice_table --test redesigned_engineer_c --test redesigned_aice_api --test redesigned_java_conditions --test redesigned_engineer_c_conditions --test redesigned_aice_selection --test redesigned_java_arrays --test redesigned_engineer_c_arrays --test table_output --test rich_output --test stable_progress --test issue_progress --test update_schedule --test explanation_progress --test update_handoff --test content_updates --test git_practice --test git_practice_resume --test git_lesson_goals --test git_merge_goals --test redesigned_git_first --test redesigned_git_branch --test change_history --test practice_exit --test pilot_restart -- --test-threads=1
      - name: Check table grading without pandas representation matching
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: python tools/test_pandas_head_checker.py
      - name: Check PRD evidence and approval boundaries
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: python tools/test_lesson_prd.py
      - name: Check approved Git lesson derivations
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/narrate.py --redesigned-git --check
          python tools/test_redesigned_highlights.py
      - name: Check adjacent review evidence and propagation
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/test_content_review.py
          python tools/test_content_review_model.py
          python tools/test_content_review_command.py
          python tools/test_review_pilot_candidate.py
          python tools/test_supporting_assets.py
          python tools/test_create_dmg.py
      - name: Prepare browser test dependency on Windows
        if: ${{ matrix.group == 'core' && (runner.os == 'Windows') }}
        run: npm install --prefix target/ui-tests --no-save playwright-core
      - name: Check isolated explanation sessions on Windows
        if: ${{ matrix.group == 'core' && (runner.os == 'Windows') }}
        run: node --test tests/js/explanation-session.test.cjs tests/js/git-terminal-session.test.cjs tests/js/interaction-example-editor.test.cjs
      - name: Check authored file-backed lesson cases
        if: matrix.group == 'core'
        shell: python
        run: |
          import os, pathlib, subprocess
          subprocess.run(['cargo', 'build', '--locked', '--example', 'validate_redesigned_lesson'], check=True)
          executable = pathlib.Path('target/debug/examples/validate_redesigned_lesson' + ('.exe' if os.name == 'nt' else ''))
          for spec in sorted(pathlib.Path('tests/lesson-cases').glob('*.json')):
              subprocess.run([str(executable), str(spec), f'target/public-lesson-{spec.stem}.json'], check=True)
      - name: Build native debug player
        id: build_player
        run: cargo build --locked --bin molip-quest
      - name: Drive the native WebView through the production player
        if: matrix.group == 'core'
        env:
          MOLIP_PILOT: '1'
          MOLIP_PILOT_SELF_TEST: '1'
        run: |
          cargo run --locked --bin molip-quest
          cp target/pilot-native-result.json target/pilot-core-result.json
      - name: Drive prepared examples with separate answers
        if: matrix.group == 'core'
        run: cargo test --locked --test player_example_native -- --ignored --test-threads=1
      - name: Drive all nine approved Java steps in the native player
        if: matrix.group == 'java'
        run: cargo test --locked --test player_java_native -- --ignored --test-threads=1
      - name: Drive all seven approved Python introduction steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_native -- --ignored --test-threads=1
      - name: Drive all eight approved Python condition steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_conditions_native -- --ignored --test-threads=1
      - name: Drive all eight approved table and CSV steps
        if: matrix.group == 'data'
        run: cargo test --locked --test player_table_native -- --ignored --test-threads=1
      - name: Drive all six approved C reading steps
        if: matrix.group == 'c'
        run: cargo test --locked --test player_c_native -- --ignored --test-threads=1
      - name: Drive all eight Python API steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_api_native -- --ignored --test-threads=1
      - name: Drive Java condition boundaries
        if: matrix.group == 'java'
        run: cargo test --locked --test player_conditions_native java_boundaries -- --ignored --test-threads=1
      - name: Drive C condition boundaries
        if: matrix.group == 'c'
        run: cargo test --locked --test player_conditions_native c_boundaries -- --ignored --test-threads=1
      - name: Drive Java array loops
        if: matrix.group == 'java'
        run: cargo test --locked --test player_data_lessons_native java_array -- --ignored --test-threads=1
      - name: Drive Java method calls and returns
        if: matrix.group == 'java'
        run: cargo test --locked --test player_data_lessons_native java_method -- --ignored --test-threads=1
      - name: Drive data selection and summaries
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native pandas_selection -- --ignored --test-threads=1
      - name: Drive C arrays and strings
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native c_array -- --ignored --test-threads=1
      - name: Drive missing, duplicate and unusual data cases
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native pandas_quality -- --ignored --test-threads=1
      - name: Drive C function and recursion cases
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native c_functions -- --ignored --test-threads=1
      - name: Drive actual plot interpretation and mean bars
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_plots -- --ignored --test-threads=1
      - name: Drive C pointer targets and copies
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_pointers -- --ignored --test-threads=1
      - name: Drive Java objects and reference copies
        if: matrix.group == 'java'
        run: cargo test --locked --test player_data_lessons_native java_references -- --ignored --test-threads=1
      - name: Drive C double-indirect targets
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_double_pointers -- --ignored --test-threads=1
      - name: Drive C structures and function pointers
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_structures -- --ignored --test-threads=1
      - name: Reopen actual player with saved answer and progress
        if: ${{ matrix.group == 'core' && (!cancelled() && steps.build_player.outcome == 'success') }}
        run: cargo test --locked --test player_restart_native -- --ignored --test-threads=1
      - name: Prepare isolated Windows installer compiler
        id: install_compiler
        if: ${{ matrix.group == 'core' && (!cancelled() && runner.os == 'Windows' && steps.build_player.outcome == 'success') }}
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler setup failed.' }
          }
      - name: Replace disposable player through the real platform installer handoff
        if: ${{ matrix.group == 'core' && (!cancelled() && steps.build_player.outcome == 'success' && (runner.os != 'Windows' || steps.install_compiler.outcome == 'success')) }}
        run: cargo test --locked --test player_install_native -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pilot-${{ matrix.os }}-${{ matrix.group }}
          path: |
            target/pilot-native-result.json
            target/pilot-core-result.json
            target/pilot-java-result.json
            target/pilot-python-result.json
            target/pilot-python-conditions-result.json
            target/pilot-table-result.json
            target/pilot-c-result.json
            target/pilot-python-api-result.json
            target/pilot-java-conditions-result.json
            target/pilot-aice-selection-result.json
            target/pilot-java-arrays-result.json
            target/pilot-engineer-c-arrays-result.json
            target/pilot-engineer-c-double-pointers-result.json
            target/pilot-engineer-c-structures-result.json
            target/pilot-java-references-result.json
            target/pilot-engineer-c-pointers-result.json
            target/pilot-aice-plots-result.json
            target/pilot-java-methods-result.json
            target/pilot-aice-quality-result.json
            target/pilot-engineer-c-functions-result.json
            target/public-lesson-*.json
            target/pilot-engineer-c-conditions-result.json
            target/pilot-example-result.json
            target/pilot-restart-*.json
            target/pilot-install-result.json
          if-no-files-found: warn
