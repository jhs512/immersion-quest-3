name: Player pilot validation
on:
  push:
    branches: [codex/player-content-pilot]
  workflow_dispatch:
    inputs:
      groups:
        description: 'JSON list of validation groups; leave the default for every group'
        required: true
        default: '["core","git","java","java-object","java-app","web","sql","engineer-java","theory","systems","release-runtime","python","data","c","model","classify","neural"]'
      platforms:
        description: 'JSON list of runner platforms; default validates all supported desktop platforms'
        required: true
        default: '["windows-latest","macos-15","macos-15-intel"]'
permissions:
  contents: read
concurrency:
  group: player-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-pilot:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["windows-latest","macos-15","macos-15-intel"]') }}
        group: ${{ fromJSON(inputs.groups || '["core","git","java","java-object","java-app","web","sql","engineer-java","theory","systems","release-runtime","python","data","c","model","classify","neural"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.group == 'release-runtime' && (matrix.os == 'macos-15-intel' && '3.12' || '3.13') || '3.11' }}
      - name: Install the approved table lesson's pandas version
        if: matrix.group != 'release-runtime'
        run: python -m pip install "numpy<2" "pandas==1.5.3" "matplotlib==3.7.1" "seaborn==0.12.1" "scipy==1.11.4" "scikit-learn==1.3.2"
      - name: Install the separately documented Keras 2 learning environment
        if: matrix.group == 'core' || matrix.group == 'neural' || matrix.group == 'architecture'
        run: python -m pip install "tensorflow==2.15.1"
      - name: Provide the macOS boosting library dependency
        if: runner.os == 'macOS' && (matrix.group == 'core' || matrix.group == 'classify' || matrix.group == 'release-runtime')
        run: brew install libomp
      - name: Install the exact production learning requirements
        if: matrix.group == 'release-runtime'
        shell: python
        run: |
          import pathlib, platform, subprocess, sys
          requirements = pathlib.Path('requirements-learning.txt').read_text()
          if sys.platform == 'darwin' and platform.machine() == 'x86_64':
              requirements = '\n'.join(line for line in requirements.splitlines() if not line.startswith('tensorflow==')) + '\ntensorflow==2.16.2\n'
          path = pathlib.Path('target/production-requirements.txt')
          path.parent.mkdir(exist_ok=True)
          path.write_text(requirements)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-r', str(path)], check=True)
      - name: Install the separately documented boosting learning version
        if: matrix.group == 'core' || matrix.group == 'classify'
        run: python -m pip install "xgboost==2.1.4"
      - name: Use the same Python interpreter inside the player
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'MOLIP_PYTHON={sys.executable}\n')
      - uses: Swatinem/rust-cache@v2
        with:
          key: pilot-${{ matrix.os }}
          cache-on-failure: true
      - name: Check hierarchy, legacy compatibility and isolated transport
        if: matrix.group == 'core'
        run: cargo test --locked --test nested_repository_course --test reviewed_pilot --test supporting_materials --test repository_review_modes --test pilot_transport --test task_interactions --test interaction_examples --test interaction_fields --test example_predictions --test java_prepared_values --test redesigned_java_values --test redesigned_aice_python --test redesigned_aice_conditions --test redesigned_aice_table --test redesigned_engineer_c --test redesigned_aice_api --test redesigned_java_conditions --test redesigned_engineer_c_conditions --test redesigned_aice_selection --test redesigned_java_arrays --test redesigned_engineer_c_arrays --test table_output --test rich_output --test stable_progress --test issue_progress --test update_schedule --test explanation_progress --test update_handoff --test content_updates --test git_practice --test git_practice_resume --test git_lesson_goals --test git_merge_goals --test redesigned_git_first --test redesigned_git_branch --test change_history --test practice_exit --test pilot_restart -- --test-threads=1
      - name: Check table grading without pandas representation matching
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: python tools/test_pandas_head_checker.py
      - name: Check PRD evidence and approval boundaries
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: python tools/test_lesson_prd.py
      - name: Check all three default course snapshots and retained user courses
        if: matrix.group == 'core'
        run: |
          python tools/build-redesigned-course-bundle.py --check
          python tools/test_lesson_registry.py
          cargo test --locked --test lesson_registry -- --test-threads=1
          cargo test --locked --lib course_authoring_tests -- --test-threads=1
      - name: Check approved Git lesson derivations
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/narrate.py --redesigned-git --check
          python tools/test_redesigned_highlights.py
      - name: Check adjacent review evidence and propagation
        if: matrix.group == 'core'
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/test_content_review.py
          python tools/test_content_review_model.py
          python tools/test_content_review_command.py
          python tools/test_review_pilot_candidate.py
          python tools/test_supporting_assets.py
          python tools/test_python_prepared_checks.py
          python tools/test_create_dmg.py
      - name: Prepare browser test dependency on Windows
        if: ${{ matrix.group == 'core' && (runner.os == 'Windows') }}
        run: npm install --prefix target/ui-tests --no-save playwright-core
      - name: Prepare the pinned lightweight frontend runtime
        if: matrix.group == 'web' || matrix.group == 'architecture'
        run: npm install --prefix target/ui-tests --no-audit --no-fund playwright-core@1.64.0 esbuild@0.28.2 react@19.3.1 react-dom@19.3.1 @tailwindcss/browser@4.3.3
      - name: Check a fresh managed browser without requiring Edge
        if: matrix.group == 'web'
        run: node --test tests/js/web-browser-runtime.test.cjs
      - name: Check actual learner browser interactions and previews
        if: matrix.group == 'web'
        run: |
          cargo test --locked --lib managed_web_tests -- --test-threads=1
          cargo test --locked --lib quoted_web_output_tests -- --test-threads=1
      - name: Check isolated explanation sessions on Windows
        if: ${{ (matrix.group == 'core' || matrix.group == 'architecture') && (runner.os == 'Windows') }}
        run: node --test tests/js/explanation-session.test.cjs tests/js/git-terminal-session.test.cjs tests/js/interaction-example-editor.test.cjs
      - name: Check authored file-backed lesson cases
        if: matrix.group == 'core'
        shell: python
        run: |
          import os, pathlib, subprocess
          subprocess.run(['cargo', 'build', '--locked', '--example', 'validate_redesigned_lesson'], check=True)
          executable = pathlib.Path('target/debug/examples/validate_redesigned_lesson' + ('.exe' if os.name == 'nt' else ''))
          for spec in sorted(pathlib.Path('tests/lesson-cases').glob('*.json')):
              subprocess.run([str(executable), str(spec), f'target/public-lesson-{spec.stem}.json'], check=True)
      - name: Verify the new Python lessons with the shipped learning environment
        if: matrix.group == 'release-runtime'
        shell: python
        run: |
          import importlib, json, os, pathlib, subprocess, sys
          versions = {'python': sys.version}
          for name in ['numpy', 'pandas', 'sklearn', 'tensorflow', 'keras', 'xgboost', 'edge_tts']:
              versions[name] = importlib.import_module(name).__version__
          pathlib.Path('target/production-runtime-versions.json').write_text(json.dumps(versions, indent=2))
          subprocess.run(['cargo', 'test', '--locked', '--lib', 'doctor::install_tests::environment_installs_and_passes_the_checks', '--', '--ignored', '--test-threads=1'], check=True)
          for name in ['redesigned_aice_python', 'redesigned_aice_conditions', 'redesigned_aice_api', 'redesigned_aice_table']:
              subprocess.run(['cargo', 'test', '--locked', '--test', name, '--', '--test-threads=1'], check=True)
          subprocess.run(['cargo', 'build', '--locked', '--example', 'validate_redesigned_lesson'], check=True)
          executable = pathlib.Path('target/debug/examples/validate_redesigned_lesson' + ('.exe' if os.name == 'nt' else ''))
          for spec in sorted(pathlib.Path('tests/lesson-cases').glob('*.json')):
              if spec.stem.startswith(('aice-', 'engineer-python-')):
                  subprocess.run([str(executable), str(spec), f'target/public-production-{spec.stem}.json'], check=True)
      - name: Check real isolated remote Git lesson cases
        if: matrix.group == 'git'
        run: cargo run --locked --example validate_redesigned_git
      - name: Build native debug player
        if: matrix.group != 'release-runtime'
        id: build_player
        run: cargo build --locked --bin molip-quest
      - name: Verify consolidated registration and explanation ownership
        if: matrix.group == 'architecture'
        shell: python
        run: |
          import os, pathlib, subprocess
          subprocess.run(['python', 'tools/test_lesson_registry.py'], check=True)
          subprocess.run(['python', 'tools/build-redesigned-course-bundle.py', '--check'], check=True)
          subprocess.run(['cargo', 'test', '--locked', '--test', 'lesson_registry', '--test', 'content_updates', '--test', 'git_practice', '--', '--test-threads=1'], check=True)
          subprocess.run(['cargo', 'run', '--locked', '--bin', 'molip-quest'], env=dict(os.environ, MOLIP_PILOT='1', MOLIP_PILOT_SELF_TEST='1'), check=True)
          pathlib.Path('target/pilot-core-result.json').write_bytes(pathlib.Path('target/pilot-native-result.json').read_bytes())
          for target, name in [('player_python_native', ''), ('player_table_native', ''), ('player_java_native', ''), ('player_invalid_order_native', ''),
              ('player_data_lessons_native', 'java_static_restore'),
              ('player_data_lessons_native', 'engineer_c_double_pointers'),
              ('player_data_lessons_native', 'aice_tensorflow'),
              ('player_data_lessons_native', 'java_react'),
              ('player_data_lessons_native', 'git_remote')]:
              subprocess.run(['cargo', 'test', '--locked', '--test', target, name, '--', '--ignored', '--test-threads=1'], check=True)
      - name: Drive the native WebView through the production player
        if: matrix.group == 'core'
        env:
          MOLIP_PILOT: '1'
          MOLIP_PILOT_SELF_TEST: '1'
        run: |
          cargo run --locked --bin molip-quest
          cp target/pilot-native-result.json target/pilot-core-result.json
      - name: Drive prepared examples with separate answers
        if: matrix.group == 'core'
        run: cargo test --locked --test player_example_native -- --ignored --test-threads=1
      - name: Drive remote Git records and independent recovery
        if: matrix.group == 'git'
        run: cargo test --locked --test player_data_lessons_native git_remote -- --ignored --test-threads=1
      - name: Preserve the live React webpage while the tutor demonstrates
        if: matrix.group == 'web'
        run: cargo test --locked --test player_data_lessons_native java_react -- --ignored --test-threads=1
      - name: Drive lightweight Tailwind layout and independent previews
        if: matrix.group == 'web'
        run: cargo test --locked --test player_data_lessons_native java_tailwind -- --ignored --test-threads=1
      - name: Drive all nine approved Java steps in the native player
        if: matrix.group == 'java'
        run: cargo test --locked --test player_java_native -- --ignored --test-threads=1
      - name: Drive all seven approved Python introduction steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_native -- --ignored --test-threads=1
      - name: Drive all eight approved Python condition steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_conditions_native -- --ignored --test-threads=1
      - name: Drive all eight approved table and CSV steps
        if: matrix.group == 'data'
        run: cargo test --locked --test player_table_native -- --ignored --test-threads=1
      - name: Drive all six approved C reading steps
        if: matrix.group == 'c'
        run: cargo test --locked --test player_c_native -- --ignored --test-threads=1
      - name: Drive all eight Python API steps
        if: matrix.group == 'python'
        run: cargo test --locked --test player_python_api_native -- --ignored --test-threads=1
      - name: Drive Java condition boundaries
        if: matrix.group == 'java'
        run: cargo test --locked --test player_conditions_native java_boundaries -- --ignored --test-threads=1
      - name: Drive C condition boundaries
        if: matrix.group == 'c'
        run: cargo test --locked --test player_conditions_native c_boundaries -- --ignored --test-threads=1
      - name: Drive Java array loops
        if: matrix.group == 'java'
        run: cargo test --locked --test player_data_lessons_native java_array -- --ignored --test-threads=1
      - name: Drive Java method calls and returns
        if: matrix.group == 'java'
        run: cargo test --locked --test player_data_lessons_native java_method -- --ignored --test-threads=1
      - name: Drive data selection and summaries
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native pandas_selection -- --ignored --test-threads=1
      - name: Drive C arrays and strings
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native c_array -- --ignored --test-threads=1
      - name: Drive missing, duplicate and unusual data cases
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native pandas_quality -- --ignored --test-threads=1
      - name: Drive C function and recursion cases
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native c_functions -- --ignored --test-threads=1
      - name: Drive actual plot interpretation and mean bars
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_plots -- --ignored --test-threads=1
      - name: Drive C pointer targets and copies
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_pointers -- --ignored --test-threads=1
      - name: Drive the independent SQL and data model lessons
        if: matrix.group == 'sql'
        run: |
          cargo test --locked --test player_data_lessons_native engineer_db -- --ignored --test-threads=1
          cargo test --locked --test player_data_lessons_native engineer_sql -- --ignored --test-threads=1
      - name: Drive the independent engineer Java lessons
        if: matrix.group == 'engineer-java'
        run: cargo test --locked --test player_data_lessons_native engineer_java -- --ignored --test-threads=1
      - name: Drive the independent engineer Python lessons
        if: matrix.group == 'python'
        run: cargo test --locked --test player_data_lessons_native engineer_python -- --ignored --test-threads=1
      - name: Drive requirements, design, server, interfaces, UI, and test cases
        if: matrix.group == 'theory'
        shell: python
        run: |
          import subprocess
          for name in ['requirements', 'design', 'server', 'interfaces', 'ui', 'test_cases']:
              subprocess.run(['cargo', 'test', '--locked', '--test', 'player_data_lessons_native', 'engineer_' + name, '--', '--ignored', '--test-threads=1'], check=True)
      - name: Drive integration, security, OS, network, packaging, and combined answers
        if: matrix.group == 'systems'
        shell: python
        run: |
          import subprocess
          for name in ['test_integration', 'security', 'os', 'network', 'build', 'mixed']:
              subprocess.run(['cargo', 'test', '--locked', '--test', 'player_data_lessons_native', 'engineer_' + name, '--', '--ignored', '--test-threads=1'], check=True)
      - name: Drive Java objects and reference copies
        if: matrix.group == 'java-object'
        run: cargo test --locked --test player_data_lessons_native java_references -- --ignored --test-threads=1
      - name: Drive C double-indirect targets
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_double_pointers -- --ignored --test-threads=1
      - name: Drive C structures and function pointers
        if: matrix.group == 'c'
        run: cargo test --locked --test player_data_lessons_native engineer_c_structures -- --ignored --test-threads=1
      - name: Drive Java instance and static state
        if: matrix.group == 'java-object'
        run: cargo test --locked --test player_data_lessons_native java_static -- --ignored --test-threads=1
      - name: Drive protected state and role composition
        if: matrix.group == 'java-object'
        run: cargo test --locked --test player_data_lessons_native java_roles -- --ignored --test-threads=1
      - name: Drive collection contracts and product aggregation
        if: matrix.group == 'java-object'
        run: cargo test --locked --test player_data_lessons_native java_collections -- --ignored --test-threads=1
      - name: Drive lazy streams and aggregation boundaries
        if: matrix.group == 'java-object'
        run: cargo test --locked --test player_data_lessons_native java_streams -- --ignored --test-threads=1
      - name: Drive file persistence and error paths
        if: matrix.group == 'java-app'
        run: cargo test --locked --test player_data_lessons_native java_files -- --ignored --test-threads=1
      - name: Drive CRUD identity and storage roles
        if: matrix.group == 'java-app'
        run: cargo test --locked --test player_data_lessons_native java_crud -- --ignored --test-threads=1
      - name: Drive independent expectations and real JUnit mutation tests
        if: matrix.group == 'java-app'
        run: cargo test --locked --test player_data_lessons_native java_testing -- --ignored --test-threads=1
      - name: Drive small request grammar and calculator counterexamples
        if: matrix.group == 'java-app'
        run: cargo test --locked --test player_data_lessons_native java_parser -- --ignored --test-threads=1
      - name: Drive input feature meaning and transformations
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_features -- --ignored --test-threads=1
      - name: Drive paired data splitting and constraints
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_split -- --ignored --test-threads=1
      - name: Drive held-out information boundaries
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_leakage -- --ignored --test-threads=1
      - name: Drive trained preprocessing references
        if: matrix.group == 'model'
        run: cargo test --locked --test player_data_lessons_native aice_scale -- --ignored --test-threads=1
      - name: Drive baseline and regression predictions
        if: matrix.group == 'model'
        run: cargo test --locked --test player_data_lessons_native aice_regression -- --ignored --test-threads=1
      - name: Drive classification and metric interpretation
        if: matrix.group == 'classify'
        run: cargo test --locked --test player_data_lessons_native aice_classification -- --ignored --test-threads=1
      - name: Drive model comparison
        if: matrix.group == 'classify'
        run: cargo test --locked --test player_data_lessons_native aice_models -- --ignored --test-threads=1
      - name: Drive protected cross-validation and tuning
        if: matrix.group == 'classify'
        run: cargo test --locked --test player_data_lessons_native aice_tuning -- --ignored --test-threads=1
      - name: Drive join keys and row preservation
        if: matrix.group == 'data'
        run: cargo test --locked --test player_data_lessons_native aice_join -- --ignored --test-threads=1
      - name: Drive boosting rounds and target formats
        if: matrix.group == 'classify'
        run: cargo test --locked --test player_data_lessons_native aice_boosting -- --ignored --test-threads=1
      - name: Drive TensorFlow construction and learning
        if: matrix.group == 'neural'
        run: cargo test --locked --test player_data_lessons_native aice_tensorflow -- --ignored --test-threads=1
      - name: Drive neural regression and classification
        if: matrix.group == 'neural'
        run: cargo test --locked --test player_data_lessons_native aice_neural -- --ignored --test-threads=1
      - name: Drive monitored training and best-state preservation
        if: matrix.group == 'neural'
        run: cargo test --locked --test player_data_lessons_native aice_training -- --ignored --test-threads=1
      - name: Drive file-to-prediction integration
        if: matrix.group == 'neural'
        run: cargo test --locked --test player_data_lessons_native aice_integration -- --ignored --test-threads=1
      - name: Reopen actual player with saved answer and progress
        if: ${{ matrix.group == 'core' && (!cancelled() && steps.build_player.outcome == 'success') }}
        run: cargo test --locked --test player_restart_native -- --ignored --test-threads=1
      - name: Prepare isolated Windows installer compiler
        id: install_compiler
        if: ${{ matrix.group == 'core' && (!cancelled() && runner.os == 'Windows' && steps.build_player.outcome == 'success') }}
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler setup failed.' }
          }
      - name: Replace disposable player through the real platform installer handoff
        if: ${{ matrix.group == 'core' && (!cancelled() && steps.build_player.outcome == 'success' && (runner.os != 'Windows' || steps.install_compiler.outcome == 'success')) }}
        run: cargo test --locked --test player_install_native -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pilot-${{ matrix.os }}-${{ matrix.group }}
          path: |
            target/pilot-invalid-order-result.json
            target/production-runtime-versions.json
            target/public-production-*.json
            target/pilot-engineer-*-result.json
            target/pilot-native-result.json
            target/pilot-core-result.json
            target/pilot-java-result.json
            target/pilot-python-result.json
            target/pilot-python-conditions-result.json
            target/pilot-table-result.json
            target/pilot-c-result.json
            target/pilot-python-api-result.json
            target/pilot-java-conditions-result.json
            target/pilot-aice-selection-result.json
            target/pilot-java-arrays-result.json
            target/pilot-engineer-c-arrays-result.json
            target/pilot-engineer-c-double-pointers-result.json
            target/pilot-engineer-c-structures-result.json
            target/pilot-aice-scale-result.json
            target/pilot-aice-regression-result.json
            target/pilot-aice-regression-metrics-result.json
            target/pilot-aice-classification-result.json
            target/pilot-aice-classification-metrics-result.json
            target/pilot-aice-models-result.json
            target/pilot-aice-tuning-result.json
            target/pilot-aice-tensorflow-result.json
            target/pilot-aice-neural-regression-result.json
            target/pilot-aice-neural-classification-result.json
            target/pilot-aice-training-result.json
            target/pilot-aice-join-result.json
            target/pilot-aice-boosting-result.json
            target/pilot-aice-integration-result.json
            target/pilot-java-static-result.json
            target/pilot-java-roles-result.json
            target/pilot-java-collections-result.json
            target/pilot-java-streams-result.json
            target/pilot-java-files-result.json
            target/pilot-java-crud-result.json
            target/pilot-java-testing-result.json
            target/pilot-java-parser-result.json
            target/pilot-git-remote-result.json
            target/player-pilot-audit/git-remote/public-cases.json
            target/pilot-aice-features-result.json
            target/pilot-aice-split-result.json
            target/pilot-aice-leakage-result.json
            target/pilot-java-references-result.json
            target/pilot-engineer-c-pointers-result.json
            target/pilot-aice-plots-result.json
            target/pilot-java-methods-result.json
            target/pilot-aice-quality-result.json
            target/pilot-engineer-c-functions-result.json
            target/public-lesson-*.json
            target/pilot-engineer-c-conditions-result.json
            target/pilot-example-result.json
            target/pilot-restart-*.json
            target/pilot-install-result.json
            target/pilot-install-*.log
          if-no-files-found: warn
