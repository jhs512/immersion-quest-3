name: macOS report capture
on:
  push:
    branches: [fix/mq-macos-report-capture]
    paths:
      - 'tools/mac-report-capture-probe/**'
      - 'tools/mac_report_capture_check.py'
      - 'src/bug_report.rs'
      - 'src/emergency_report.rs'
      - 'assets/diagnostics/report.js'
      - '.github/workflows/macos-report-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-report-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture from a helper process and from the window's own process
        run: bash tools/mac-report-capture-probe/run.sh "$RUNNER_TEMP/probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-report-capture-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe/*.json
