name: OS input capability audit
on:
  push:
    branches: [codex/os-input-capability-20261019-130411]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-input-capability:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read existing OS input permissions without prompting
        run: |
          mkdir -p target/os-input-audit
          swift tools/macos-input-capability.swift | tee target/os-input-audit/macos-capability.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-input-capability
          path: target/os-input-audit/macos-capability.json
          if-no-files-found: error
