[package]
name = "molip-quest"
version = "0.1.0"
edition = "2021"

[features]
# dx picks the feature named after the platform (--desktop / --android → mobile).
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "0.7" }
directories = "6"
dunce = "=1.0.5"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
pulldown-cmark = "0.13"
ammonia = "4"
# 해설 모드 voice: the Sec-MS-GEC token of the Edge Read Aloud handshake (src/tts.rs).
sha2 = "0.10"
base64 = "0.23"
png = "0.18.1"
ring = "0.17"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
flate2 = "1"

# The clipboard crate has no Android backend; the Android build is view-only anyway. The
# WebSocket client for the Edge voice stays off Android too (no TLS backend there, no narration).
[target.'cfg(not(target_os = "android"))'.dependencies]
tungstenite = { version = "0.28", features = ["native-tls"] }
arboard = { version = "3.6.1", default-features = false }
# Auto-update: the GitHub Releases API and the installer download (src/updater.rs).
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
portable-pty = "0.9.0"

# build.rs embeds assets/icon/icon.ico into the Windows executable.
[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "molip-quest"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Globalization","Win32_Security","Win32_System_JobObjects","Win32_System_Threading"]}
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Decode pinned conda OpenMP packages without a system zstd/Homebrew dependency.
ruzstd = "=0.9.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9.8"
global-hotkey = "0.8"
